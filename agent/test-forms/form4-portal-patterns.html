<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice form: portal patterns</title>
<!-- Patterns copied from real scholarship portals (Formdesk / Plupload). Nothing is sent anywhere. -->
<style>
  body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; }
  td { padding: 6px; vertical-align: top; }
  .RequiredSign { color: #c00; }
  .hint { font-size: 8pt; color: #555; }
  /* styled radios: the real input is invisible, a picture in the label covers it */
  .item-container { position: relative; }
  input.themed { position: absolute; opacity: 0; width: 14px; height: 14px; margin: 0; }
  input.themed + label i { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  input.themed:checked + label i { background: #333; }
  .upload-selection { position: relative; display: inline-block; }
  .moxie-shim { position: absolute; top: 0; left: 0; width: 0; height: 0; overflow: hidden; }
</style>
</head>
<body>
<h1>Practice application (portal patterns)</h1>
<form onsubmit="return false">
<table>
  <tr>
    <td><label for="email" id="q1"><strong>Email Address:</strong><br><span class="hint">Please avoid using hotmail accounts when filling out this form, as these e-mails often end up in spam folders and we may not reach you.</span><span class="RequiredSign">&nbsp;*</span></label></td>
    <td><input type="text" id="email" name="email" aria-labelledby="q1"></td>
  </tr>
  <tr>
    <td><label id="q2">Do you hold multiple nationalities?<br><span class="hint">Please only mention countries for which you hold official citizenship.</span><span class="RequiredSign">&nbsp;*</span></label></td>
    <td><div role="group" aria-labelledby="q2">
      <div class="item-container"><input type="radio" class="themed" id="multi1" name="multi" value="Yes"><label for="multi1"><i></i><span>Yes</span></label></div>
      <div class="item-container"><input type="radio" class="themed" id="multi2" name="multi" value="No"><label for="multi2"><i></i><span>No</span></label></div>
    </div></td>
  </tr>
  <tr>
    <td><label id="q3">Are you currently&nbsp;<strong>enrolled&nbsp;</strong>in one (or more) Master Degree programmes?&nbsp;<span class="RequiredSign">&nbsp;*</span></label></td>
    <td><div role="group" aria-labelledby="q3">
      <div class="item-container"><input type="radio" class="themed" id="enr1" name="enrolled" value="Yes"><label for="enr1"><i></i><span>Yes</span></label></div>
      <div class="item-container"><input type="radio" class="themed" id="enr2" name="enrolled" value="No"><label for="enr2"><i></i><span>No</span></label></div>
    </div></td>
  </tr>
  <tr>
    <td><label for="bafield" id="q4">What is the field of your Bachelor Degree?<span class="RequiredSign">&nbsp;*</span></label></td>
    <td><select id="bafield" name="bafield" aria-labelledby="q4">
      <option>&lt; Please make your choice &gt;</option>
      <option>Speech and language pathology</option><option>Linguistics</option><option>Biomedical sciences</option>
      <option>Psychology</option><option>Special education</option>
    </select></td>
  </tr>
  <tr><td><label for="lang1">Language 1:</label></td><td><input type="text" id="lang1" placeholder="Spanish: Reading B1, Writing B1"></td></tr>
  <tr><td><label for="lang2">Language 2:</label></td><td><input type="text" id="lang2"></td></tr>
  <tr><td><label for="lang3">Language 3:</label></td><td><input type="text" id="lang3"></td></tr>
  <tr><td><label for="ref1">Name referee 1<span class="RequiredSign">&nbsp;*</span></label></td><td><input type="text" id="ref1"></td></tr>
  <tr><td><label for="ref1mail">E-mail address referee 1<span class="RequiredSign">&nbsp;*</span></label></td><td><input type="text" id="ref1mail"></td></tr>
  <tr>
    <td><label for="cvname" id="q5">Please upload your <strong>Curriculum Vitae</strong> here<br><span class="hint">We only accept .pdf files!</span><span class="RequiredSign">&nbsp;*</span></label></td>
    <td>
      <div class="upload-selection">
        <input type="text" id="cvname" readonly tabindex="-1" aria-labelledby="q5">
        <button type="button" title="Choose file...">📎</button>
      </div>
    </td>
  </tr>
</table>
<p><button type="button">Save Progress</button> <button type="button">Final Submission</button></p>
</form>

<!-- the real file input is created far away from its question, like Plupload does -->
<div id="html5_k2m8x9q4w7z1v3b5n6_container" class="moxie-shim moxie-shim-html5">
  <input id="html5_k2m8x9q4w7z1v3b5n6" type="file" accept=".pdf" tabindex="-1" style="opacity:0;position:absolute;top:0;left:0;width:100%;height:100%">
</div>
<script>
  // place the shim over the upload button (inside its box), as Plupload does on start-up
  const shim = document.querySelector('.moxie-shim');
  document.querySelector('.upload-selection').appendChild(shim);
  // after a file is picked: show its name in the read-only box and empty the real input
  shim.querySelector('input').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) document.getElementById('cvname').value = f.name;
    e.target.value = '';
  });
</script>
</body>
</html>
